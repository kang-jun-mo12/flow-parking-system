<svg xmlns="http://www.w3.org/2000/svg" width="680" height="910" viewBox="0 0 680 910" role="img"><title>최종 주차 시스템 아키텍처</title><desc>카메라 6대가 DDP 앞단, YOLO-World, UniDepth 세 고정 모델로 들어가 증거 BEV가 되고, 학습한 BEV 정제기와 규칙 기반 보행자 추적기를 거쳐 세계 상태가 된다. 학습한 주차 모델은 DDP 앞단을 직접 읽고, 학습한 중재기와 회피 Flow는 세계 상태를 읽는다. 규칙 기반 감독기와 안전 검사를 지나 차량 제어로 이어진다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text { font-family: -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
.th { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
.ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.arr { stroke: #73726C; stroke-width: 1.5; fill: none; }
.c-gray rect, rect.c-gray { fill: #F1EFE8; stroke: #888780; stroke-width: 1; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
.c-purple rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
.c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
.c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
</style>
<rect x="0" y="0" width="680" height="910" rx="12" fill="#FFFFFF"/>

